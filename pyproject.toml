[project]
name = "legacybridge"
version = "1.0.0"
description = "Order-desk integration for a simulated Java 8 legacy ERP (HALDEN ERP 3.1) through its published HTTP interface."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "streamlit==1.66.1",
    "pandas==3.1.1",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires the running sim-on Java HALDEN ERP (docker compose up -d --no-build legacy-erp)",
    "ordinary: requires a fresh sim-off HALDEN ERP (HALDEN_SIM_CONTROL=false)",
]
addopts = "-m 'not ordinary'"
