<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">LEGACYBRIDGE architecture</title>
  <desc id="desc">A human operator uses the Streamlit interface in the Python 3.12 console container. The interface and an optional, bounded AI assistant with six read and draft tools and no submit tool call BridgeService, which normalizes ERP data, keeps in-memory draft state, consumes the human approval and reconciles uncertain outcomes. BridgeService calls LegacyClient, which reaches HALDEN ERP endpoints E1 to E8 over HTTP only. HALDEN ERP 3.1 runs on Java 8 in its own container: GatewayFilter, servlets for customer, inventory and order operations, OrderBook with one JDBC transaction, and SQLite inside the container. Order writes follow five steps: prepare, authorize, attempt one POST, observe, reconcile with read-only re-checks.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .h { font-weight: 600; }
    .wire { stroke: #6e7781; fill: none; stroke-width: 1.6; }
    .tip { fill: #6e7781; }
    .httpwire { stroke: #1f2328; fill: none; stroke-width: 2.4; }
    .httptip { fill: #1f2328; }
    .pyc { fill: #f3f7fd; stroke: #4a7fd4; }
    .py { fill: #ffffff; stroke: #4a7fd4; }
    .pygrp { fill: #e6effb; stroke: #4a7fd4; stroke-dasharray: 5 4; }
    .jvc { fill: #fdf6ec; stroke: #c27c1a; }
    .jv { fill: #ffffff; stroke: #c27c1a; }
    .chip { fill: #fbecd6; stroke: #c27c1a; }
    .ai { fill: #f7f2ff; stroke: #8250df; stroke-dasharray: 6 4; }
    .hu { fill: #eaf6ee; stroke: #1a7f37; }
    .step { fill: #f6f8fa; stroke: #8c959f; }
    .pill { fill: #ffffff; stroke: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .wire { stroke: #8b949e; }
      .tip { fill: #8b949e; }
      .httpwire { stroke: #e6edf3; }
      .httptip { fill: #e6edf3; }
      .pyc { fill: #0c1a2e; stroke: #4c8eda; }
      .py { fill: #0d1117; stroke: #4c8eda; }
      .pygrp { fill: #11243f; stroke: #4c8eda; }
      .jvc { fill: #1f1608; stroke: #d29922; }
      .jv { fill: #0d1117; stroke: #d29922; }
      .chip { fill: #33240b; stroke: #d29922; }
      .ai { fill: #1c1430; stroke: #a371f7; }
      .hu { fill: #0f2418; stroke: #3fb950; }
      .step { fill: #161b22; stroke: #6e7681; }
      .pill { fill: #0d1117; stroke: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="httptip" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="899" height="699" rx="14"/>

  <!-- Human operator -->
  <rect class="hu" x="45" y="18" width="180" height="56" rx="28" stroke-width="1.6"/>
  <text class="t h" x="135" y="42" font-size="16" text-anchor="middle">Human operator</text>
  <text class="m" x="135" y="62" font-size="13" text-anchor="middle">browser · 127.0.0.1:8501</text>

  <!-- Console container (Python) -->
  <rect class="pyc" x="20" y="96" width="440" height="440" rx="12" stroke-width="1.6"/>
  <text class="t h" x="444" y="120" font-size="14" text-anchor="end">Console container · Python 3.12</text>

  <rect class="py" x="40" y="146" width="190" height="96" rx="8" stroke-width="1.6"/>
  <text class="t h" x="135" y="172" font-size="16" text-anchor="middle">Streamlit interface</text>
  <text class="m" x="135" y="194" font-size="13" text-anchor="middle">5 views · Order Desk</text>
  <text class="m" x="135" y="213" font-size="13" text-anchor="middle">Approve button =</text>
  <text class="m" x="135" y="231" font-size="13" text-anchor="middle">the only approval</text>

  <rect class="ai" x="250" y="146" width="190" height="96" rx="8" stroke-width="1.6"/>
  <text class="t h" x="345" y="172" font-size="16" text-anchor="middle">AI assistant</text>
  <text class="m" x="345" y="194" font-size="13" text-anchor="middle">optional · bounded</text>
  <text class="m" x="345" y="213" font-size="13" text-anchor="middle">6 read/draft tools</text>
  <text class="m" x="345" y="231" font-size="13" text-anchor="middle">no submit tool</text>
  <line class="wire" x1="230" y1="194" x2="248" y2="194" marker-end="url(#a)"/>

  <rect class="pygrp" x="36" y="268" width="408" height="252" rx="10" stroke-width="1.4"/>
  <line class="wire" x1="135" y1="242" x2="135" y2="300" marker-end="url(#a)"/>
  <line class="wire" x1="345" y1="242" x2="345" y2="300" marker-end="url(#a)"/>

  <rect class="py" x="56" y="303" width="368" height="112" rx="8" stroke-width="1.6"/>
  <text class="t h" x="240" y="328" font-size="16" text-anchor="middle">BridgeService</text>
  <text class="m" x="240" y="350" font-size="13" text-anchor="middle">Snapshot reads · deterministic normalization</text>
  <text class="m" x="240" y="369" font-size="13" text-anchor="middle">DraftStore: in-memory draft state</text>
  <text class="m" x="240" y="388" font-size="13" text-anchor="middle">Approval consumed before any network I/O</text>
  <text class="m" x="240" y="407" font-size="13" text-anchor="middle">Uncertain-outcome reconciliation</text>
  <line class="wire" x1="240" y1="415" x2="240" y2="432" marker-end="url(#a)"/>

  <rect class="py" x="56" y="435" width="368" height="56" rx="8" stroke-width="1.6"/>
  <text class="t h" x="240" y="459" font-size="16" text-anchor="middle">LegacyClient</text>
  <text class="m" x="240" y="479" font-size="13" text-anchor="middle">E1–E8 only · order POST never retried</text>

  <text class="t h" x="56" y="510" font-size="13">Python integration layer</text>

  <!-- Legacy container (Java) -->
  <rect class="jvc" x="580" y="96" width="300" height="440" rx="12" stroke-width="1.6"/>
  <text class="t h" x="596" y="120" font-size="14">HALDEN ERP 3.1 · Java 8</text>

  <rect class="jv" x="596" y="146" width="268" height="64" rx="8" stroke-width="1.6"/>
  <text class="t h" x="730" y="172" font-size="16" text-anchor="middle">GatewayFilter</text>
  <text class="m" x="730" y="193" font-size="13" text-anchor="middle">ticket auth · rate limit</text>
  <line class="wire" x1="730" y1="210" x2="730" y2="229" marker-end="url(#a)"/>

  <rect class="jv" x="596" y="232" width="268" height="150" rx="8" stroke-width="1.6"/>
  <text class="t h" x="730" y="257" font-size="16" text-anchor="middle">Servlets E1–E8</text>
  <rect class="chip" x="612" y="270" width="236" height="28" rx="6"/>
  <text class="t" x="730" y="289" font-size="13" text-anchor="middle">Customers · E3</text>
  <rect class="chip" x="612" y="304" width="236" height="28" rx="6"/>
  <text class="t" x="730" y="323" font-size="13" text-anchor="middle">Inventory: items, stock · E4–E5</text>
  <rect class="chip" x="612" y="338" width="236" height="28" rx="6"/>
  <text class="t" x="730" y="357" font-size="13" text-anchor="middle">Orders: search, read, book · E6–E8</text>
  <line class="wire" x1="730" y1="382" x2="730" y2="399" marker-end="url(#a)"/>

  <rect class="jv" x="596" y="402" width="268" height="54" rx="8" stroke-width="1.6"/>
  <text class="t h" x="730" y="425" font-size="16" text-anchor="middle">OrderBook</text>
  <text class="m" x="730" y="445" font-size="13" text-anchor="middle">one JDBC transaction · write lock</text>
  <line class="wire" x1="730" y1="456" x2="730" y2="469" marker-end="url(#a)"/>

  <rect class="jv" x="596" y="472" width="268" height="50" rx="8" stroke-width="1.6"/>
  <text class="t h" x="730" y="494" font-size="15" text-anchor="middle">SQLite</text>
  <text class="m" x="730" y="512" font-size="12" text-anchor="middle">inside the container only</text>

  <!-- HTTP boundary -->
  <path class="httpwire" d="M424,463 H520 V178 H592" marker-end="url(#b)"/>
  <rect class="pill" x="466" y="280" width="108" height="72" rx="10" stroke-width="1.6"/>
  <text class="t h" x="520" y="304" font-size="15" text-anchor="middle">HTTP only</text>
  <text class="m" x="520" y="323" font-size="12" text-anchor="middle">no shared DB,</text>
  <text class="m" x="520" y="339" font-size="12" text-anchor="middle">volume or code</text>

  <!-- Operator to interface -->
  <line class="wire" x1="135" y1="74" x2="135" y2="143" marker-end="url(#a)"/>

  <!-- Order write path -->
  <text class="t h" x="40" y="576" font-size="15">Human-approved order write path</text>

  <rect class="step" x="40" y="592" width="148" height="56" rx="8" stroke-width="1.4"/>
  <text class="t h" x="114" y="615" font-size="15" text-anchor="middle">1 Prepare</text>
  <text class="m" x="114" y="635" font-size="12" text-anchor="middle">draft from ERP reads</text>
  <line class="wire" x1="188" y1="620" x2="206" y2="620" marker-end="url(#a)"/>

  <rect class="hu" x="208" y="592" width="148" height="56" rx="8" stroke-width="1.6"/>
  <text class="t h" x="282" y="615" font-size="15" text-anchor="middle">2 Authorize</text>
  <text class="m" x="282" y="635" font-size="12" text-anchor="middle">operator approves</text>
  <line class="wire" x1="356" y1="620" x2="374" y2="620" marker-end="url(#a)"/>

  <rect class="step" x="376" y="592" width="148" height="56" rx="8" stroke-width="1.4"/>
  <text class="t h" x="450" y="615" font-size="15" text-anchor="middle">3 Attempt</text>
  <text class="m" x="450" y="635" font-size="12" text-anchor="middle">exactly one POST</text>
  <line class="wire" x1="524" y1="620" x2="542" y2="620" marker-end="url(#a)"/>

  <rect class="step" x="544" y="592" width="148" height="56" rx="8" stroke-width="1.4"/>
  <text class="t h" x="618" y="615" font-size="15" text-anchor="middle">4 Observe</text>
  <text class="m" x="618" y="635" font-size="12" text-anchor="middle">classify the reply</text>
  <line class="wire" x1="692" y1="620" x2="710" y2="620" marker-end="url(#a)"/>

  <rect class="step" x="712" y="592" width="148" height="56" rx="8" stroke-width="1.4"/>
  <text class="t h" x="786" y="615" font-size="15" text-anchor="middle">5 Reconcile</text>
  <text class="m" x="786" y="635" font-size="12" text-anchor="middle">read-only re-check</text>

  <text class="m" x="40" y="678" font-size="13">Outcomes: CONFIRMED · REJECTED · NOT_APPLIED · UNKNOWN. A lost reply is UNKNOWN: re-check, never resend.</text>
</svg>
